name: Auto VoxelCraft Farm 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: voxelcraft-run
  cancel-in-progress: false

jobs:
  run-voxelcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Bot VoxelCraft 24/7
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          TELEGRAM_SESSION_B64_ACC1: ${{ secrets.TELEGRAM_SESSION_B64_ACC1 }}
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python auto_voxelcraft.py

      - name: Tu dong ban giao ca tiep theo (Handover Chaining 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Kich hoat ca chay tiep theo..."
          sleep 10
          gh workflow run voxelcraft.yml --repo "${{ github.repository }}" || echo "Handover triggered."
