name: Auto VoxelCraft Farm - Acc 4 (Wind_trader)

on:
  workflow_dispatch:
  schedule:
    - cron: '14 */4 * * *'

concurrency:
  group: voxelcraft-acc4
  cancel-in-progress: true

jobs:
  run-voxelcraft-acc4:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chay Bot VoxelCraft - Acc 4 (Wind_trader)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python auto_voxelcraft.py --acc 4

      - name: Tu dong ban giao ca tiep theo (Handover Chaining 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Kich hoat ca chay tiep theo..."
          sleep 10
          gh workflow run voxelcraft_acc4.yml --repo "${{ github.repository }}" || echo "Handover triggered."
